server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
    }

    # The console's own API client (src/api.ts) calls same-origin paths
    # under /v1/ and relies on this proxy to reach the API container --
    # every route the API registers is under this one prefix (see
    # apps/api/src/cairn_api/routes_*.py). Without this block every /v1/
    # call falls through to the SPA fallback below and gets back
    # index.html instead of JSON.
    location /v1/ {
        proxy_pass http://api:8080/v1/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
