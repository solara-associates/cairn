server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
