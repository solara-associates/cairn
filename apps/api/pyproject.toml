[project]
name = "cairn-api"
version = "0.1.0"
description = "CAIRN API service"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cairn-adapters",
    "cairn-contracts",
    "cairn-kernel",
    "cairn-modules",
    "fastapi>=0.162.5",
    "uvicorn>=0.34",
]

[tool.uv.sources]
cairn-adapters = { workspace = true }
cairn-contracts = { workspace = true }
cairn-kernel = { workspace = true }
cairn-modules = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_api"]
