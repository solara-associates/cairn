[project]
name = "cairn-worker"
version = "0.1.0"
description = "CAIRN worker service"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_worker"]
