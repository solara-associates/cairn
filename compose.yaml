name: cairn

services:
  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./infra/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:5556/dex/.well-known/openid-configuration
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CAIRN_OIDC_ISSUER: http://localhost:3000/dex
      CAIRN_OIDC_AUDIENCE: cairn-console
      CAIRN_OIDC_JWKS_URL: http://dex:5556/dex/keys
      CAIRN_OIDC_TENANT_CLAIM: name
      CAIRN_OIDC_ROLES_CLAIM: groups
    depends_on:
      dex:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "8081:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    ports:
      - "3000:8080"
    environment:
      CAIRN_CONSOLE_OIDC_ISSUER: http://localhost:3000/dex
      CAIRN_CONSOLE_OIDC_CLIENT_ID: cairn-console
      # Must include "groups" -- dex only puts a "groups" claim in the ID
      # token when the client requests the "groups" scope (the
      # authproxy connector's X-Remote-Group header otherwise has
      # nowhere to land). Without it CAIRN_OIDC_ROLES_CLAIM=groups
      # below finds no claim at all, every principal gets zero roles,
      # and every RBAC-gated route returns Forbidden (s879).
      CAIRN_CONSOLE_OIDC_SCOPE: "openid email profile offline_access groups"
      CAIRN_CONSOLE_OIDC_REDIRECT_URI: http://localhost:3000/
    volumes:
      - ./infra/dex/console-dev.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
