[project]
name = "cairn"
version = "0.1.0"
description = "CAIRN cloud modernization platform"
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.8",
    "import-linter>=2.0",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/kernel",
    "packages/contracts",
    "packages/kits",
    "packages/adapters",
    "packages/modules",
    "apps/api",
    "apps/worker",
    "apps/scheduler",
    "apps/mcp-gateway",
    "apps/cli",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/kernel/tests",
    "packages/contracts/tests",
    "packages/kits/tests",
    "packages/adapters/tests",
    "packages/modules/tests",
    "apps/api/tests",
    "apps/worker/tests",
    "apps/mcp-gateway/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["UP046", "UP047"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
