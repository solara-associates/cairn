# Local-development-only nginx config for the console, mounted by
# compose.yaml over the image's default apps/console/nginx.conf. Adds a
# same-origin proxy to the bundled dex instance so the browser's OIDC
# discovery/token fetches don't need CORS headers (dex v2.41.1 sends
# none) -- see docs/identity.md and infra/dex/config.yaml. Not part of
# the built image: a real deployment's own nginx config
# (apps/console/nginx.conf) has no dex proxy and does not depend on a
# "dex" host existing.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
    }

    # The console's own API client (src/api.ts) calls same-origin paths
    # under /v1/ and relies on this proxy to reach the API container --
    # every route the API registers is under this one prefix (see
    # apps/api/src/cairn_api/routes_*.py). Without this block every /v1/
    # call falls through to the SPA fallback below and gets back
    # index.html instead of JSON -- which is exactly what broke the
    # quickstart's "explore the read-only assessment screens" claim
    # before this fix (s879).
    location /v1/ {
        proxy_pass http://api:8080/v1/;
    }

    location /dex/ {
        # Plays the role of the trusted authenticating reverse proxy
        # dex's authproxy connector (infra/dex/config.yaml) expects in
        # front of it -- asserting one fixed local demo identity so
        # this quickstart needs no password prompt. A real deployment
        # does not do this: see docs/identity.md.
        proxy_set_header X-Remote-User "6f0f0f31-6d0c-4f25-9a45-1d0e1a0f1f6a";
        proxy_set_header X-Remote-Email "demo@cairn.local";
        proxy_set_header X-Remote-Group "TENANT_ADMIN,ENGINEER,VIEWER";
        proxy_pass http://dex:5556/dex/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
