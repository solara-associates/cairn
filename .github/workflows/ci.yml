name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAIRN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run python -m cairn_kernel.conformance
      - if: startsWith(github.ref, 'refs/tags/')
        run: uv run python -m cairn_kernel.conformance --release
      - name: Generate Python SBOM
        run: uvx --from cyclonedx-bom cyclonedx-py environment --output-format json --output-file python-sbom.cdx.json .venv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-sbom
          path: python-sbom.cdx.json
          retention-days: 1

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run lint

  sbom-sign:
    needs: [python, rust, console]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-sbom
      - name: Write syft config (Rust-only catalogers)
        run: |
          cat > /tmp/syft-rust.yaml <<'EOF'
          default-catalogers:
            - rust
          EOF
      - name: Generate Rust SBOM (CycloneDX, Cargo.lock)
        uses: anchore/sbom-action@9f7302141466aa6482940f15371237e9d9f4c34a # v0.19.0
        with:
          path: .
          format: cyclonedx-json
          output-file: rust-sbom.cdx.json
          config: /tmp/syft-rust.yaml
          upload-artifact: false
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign SBOMs (keyless, GitHub OIDC)
        run: |
          for f in python-sbom.cdx.json rust-sbom.cdx.json; do
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-sbom
          path: |
            python-sbom.cdx.json
            python-sbom.cdx.json.sig
            python-sbom.cdx.json.pem
            rust-sbom.cdx.json
            rust-sbom.cdx.json.sig
            rust-sbom.cdx.json.pem

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - infra/terraform/modules/cairn-network
          - infra/terraform/modules/cairn-iam
          - infra/terraform/modules/cairn-data
          - infra/terraform/modules/cairn-runtime
          - infra/terraform/modules/cairn-events
          - infra/terraform/modules/cairn-observability
          - infra/terraform/modules/cairn-guardrails
          - infra/terraform/modules/cairn-evidence
          - infra/terraform/modules/cairn-connections
          - infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - run: terraform -chdir=${{ matrix.dir }} fmt -check -diff
      - run: terraform -chdir=${{ matrix.dir }} init -backend=false
      - run: terraform -chdir=${{ matrix.dir }} validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - run: checkov --directory ${{ matrix.dir }} --download-external-modules false
