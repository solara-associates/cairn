[project]
name = "cairn-kits"
version = "0.1.0"
description = "CAIRN kits"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cairn-kernel",
]

[tool.uv.sources]
cairn-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_kits"]
