[package]
name = "cairn-transform-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cairn-transform-cli"
path = "src/main.rs"

[dependencies]
cairn-transform-contract = { path = "../contract" }
cairn-transform-parser = { path = "../parser" }
cairn-transform-detector = { path = "../detector" }
cairn-transform-patcher = { path = "../patcher" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
