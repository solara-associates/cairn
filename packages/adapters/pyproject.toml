[project]
name = "cairn-adapters"
version = "0.1.0"
description = "CAIRN adapters"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cairn-contracts",
    "cairn-kernel",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
]

[tool.uv.sources]
cairn-kernel = { workspace = true }
cairn-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_adapters"]
